spring.application.name=rag-springai
server.port=${SERVER_PORT:8080}

# --- Logging estructurado (ecs | logstash | gelf) ---
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:logstash}
logging.level.com.markcode.rag=${LOG_LEVEL:INFO}

# --- Upload ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:spring_ia_rag}
spring.datasource.username=${DB_USER:rag}
spring.datasource.password=${DB_PASSWORD:rag}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3:4b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.1}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=${OLLAMA_PULL_STRATEGY:when_missing}
spring.ai.ollama.init.timeout=${OLLAMA_PULL_TIMEOUT:20m}
spring.ai.ollama.init.chat.include=true
spring.ai.ollama.init.embedding.include=true

# --- pgvector (nomic-embed-text = 768 dimensiones) ---
spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INIT_SCHEMA:true}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# --- RAG ---
app.rag.chunk-size=${RAG_CHUNK_SIZE:800}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.5}

# --- OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
