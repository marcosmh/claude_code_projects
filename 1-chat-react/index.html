<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1e1e2f" />
    <!-- Aplica el tema guardado antes del primer pintado. Misma clave/colores que src/hooks/useTheme.ts -->
    <script>
      try {
        var light = localStorage.getItem('chatroom:theme:v1') === 'light'
        document.documentElement.classList.toggle('dark', !light)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f5f6fa' : '#1e1e2f')
      } catch (e) {}
    </script>
    <title>ChatRoom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
