spring.application.name=chat-backend

# H2 en memoria: solo desarrollo y pruebas (se sustituye por una base real en una fase posterior)
spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
# Las entidades no salen de la capa de servicio: sin lazy loading en controladores
spring.jpa.open-in-view=false
# Consola H2 solo para desarrollo: http://localhost:8080/h2-console
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

# Orígenes permitidos para el WebSocket (frontend de desarrollo)
app.cors.allowed-origins=http://localhost:5173
# Historial: tamaño por defecto y máximo de GET /api/messages
app.history.default-limit=50
app.history.max-limit=200
