spring.application.name=chat-backend

# Variables locales opcionales: copia .env.example a .env (ignorado por git). Las variables de entorno reales tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Supabase). Credenciales SIEMPRE por variables de entorno; nunca en este archivo.
#   DB_URL      jdbc:postgresql://<host>:5432/<db>?sslmode=require
#   DB_USERNAME usuario (en Supabase: postgres.<project-ref>)
#   DB_PASSWORD contraseña
# El dialecto de Hibernate (PostgreSQLDialect) se detecta solo a partir del driver; no hace falta fijarlo.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# El pooler de Supabase limita las conexiones por proyecto: pool pequeño
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Esquema de PostgreSQL donde viven las tablas. En Supabase usa uno propio (p. ej. "chat") en vez de "public":
# "public" se expone por la API REST de Supabase y suele compartirse con otras aplicaciones.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.jakarta.persistence.create-database-schemas=true

# Esquema: "update" en desarrollo; el perfil prod usa "validate" (los cambios irán por Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Las entidades no salen de la capa de servicio: sin lazy loading en controladores
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Unicode (emojis) de extremo a extremo: las peticiones y respuestas HTTP van siempre en UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Orígenes permitidos para el WebSocket (frontend de desarrollo)
app.cors.allowed-origins=http://localhost:5173
# Historial: tamaño por defecto y máximo de GET /api/messages
app.history.default-limit=50
app.history.max-limit=200
