name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-claudecode
    env:
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-claudecode/package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=@invoices/backend
      - run: npm run test:coverage --workspace=@invoices/backend
      - run: npm run build --workspace=@invoices/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-claudecode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-claudecode/package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=@invoices/frontend
      - run: npm run test:coverage --workspace=@invoices/frontend
      - run: npm run build --workspace=@invoices/frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: demo-claudecode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-claudecode/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: demo-claudecode/apps/frontend
      - run: npm run test:e2e
        working-directory: demo-claudecode/apps/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            demo-claudecode/apps/frontend/playwright-report
            demo-claudecode/apps/frontend/test-results
          retention-days: 7
