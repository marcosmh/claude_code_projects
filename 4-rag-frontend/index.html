<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#2a1650" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
    <script>
      // Aplica el tema guardado antes del primer pintado (sin parpadeo). Misma clave que src/hooks/useTheme.ts
      try {
        var light = localStorage.getItem('rag:theme:v1') === 'light'
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f6f1ff' : '#2a1650')
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <title>RAG Legal · Documentos y consultas</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación requiere JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
